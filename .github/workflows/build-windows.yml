name: Build Windows executable

# Triggers:
#   - Every push to master → uploads .zip as a workflow artifact (10-day retention)
#   - Push a tag like v1.0.0 → also creates a GitHub Release with the .zip attached
#   - Manual trigger from the Actions tab → same as a push
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller ProCleaner.spec

      - name: Show what was built
        shell: pwsh
        run: |
          Write-Host "=== dist contents ==="
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package into TurboDesk.zip
        # PyInstaller produces dist/ProCleaner/ containing run.exe + all its DLLs.
        # Zip the whole folder — the exe won't launch without its sibling DLLs.
        # A real installer (Inno Setup) is a follow-up; this gets us a downloadable today.
        shell: pwsh
        run: |
          $buildDir = 'dist\ProCleaner'
          if (-not (Test-Path $buildDir)) {
            Write-Error "Expected build folder $buildDir does not exist"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          $zipPath = 'dist\release\TurboDesk.zip'
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath -Force
          $size = (Get-Item $zipPath).Length
          Write-Host "Created $zipPath ($([math]::Round($size/1MB, 2)) MB)"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboDesk-Windows
          path: dist\release\TurboDesk.zip
          if-no-files-found: error
          retention-days: 10

      - name: Publish as GitHub Release (only on tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\release\TurboDesk.zip
          generate_release_notes: true
